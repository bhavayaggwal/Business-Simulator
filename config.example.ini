; Database settings. Copy this file to config.ini (setup_db.py does this for
; you the first time) and change the server name if yours is different.
; config.ini is not committed to Git: every laptop has its own.

[database]
; SQL Server Express usually installs as localhost\SQLEXPRESS.
; A full SQL Server install is usually just localhost.
server = localhost\SQLEXPRESS
database = BusinessSimulator
driver = ODBC Driver 18 for SQL Server
; yes = sign in with your Windows account (no password stored anywhere)
trusted_connection = yes
; yes = accept the self-signed certificate a local SQL Server uses
trust_server_certificate = yes
